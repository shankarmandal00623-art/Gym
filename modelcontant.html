<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IronFit Membership</title>
    <style>
        /* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================
   BODY
========================================= */

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: "Montserrat", Arial, sans-serif;

    background: #080808;

    color: white;

    overflow: hidden;
}


/* =========================================
   PAGE / BACKGROUND
========================================= */

.page {
    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    background:
        radial-gradient(
            ellipse at center,
            rgba(90, 20, 15, 0.25) 0%,
            rgba(20, 10, 10, 0.08) 35%,
            rgba(0, 0, 0, 0.85) 75%,
            #050505 100%
        );
}


/*
   Subtle red light behind modal
*/
.page::before {
    content: "";

    position: absolute;

    width: 550px;
    height: 450px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: rgba(255, 35, 15, 0.08);

    filter: blur(90px);

    pointer-events: none;
}


/* =========================================
   MODAL
========================================= */

.modal {
    position: relative;

    width: 620px;
    min-height: 600px;

    border: 1px solid rgba(255, 255, 255, 0.20);

    background:
        radial-gradient(
            ellipse at 70% 35%,
            rgba(150, 25, 15, 0.18),
            transparent 48%
        ),
        rgba(14, 14, 14, 0.92);

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.7),
        inset 0 0 80px rgba(255, 30, 15, 0.025);

    overflow: hidden;
}


/*
   Red glow inside modal
*/
.modal::after {
    content: "";

    position: absolute;

    width: 380px;
    height: 250px;

    right: -80px;
    top: 100px;

    background: rgba(255, 30, 15, 0.10);

    filter: blur(80px);

    pointer-events: none;
}


/* =========================================
   MODAL CONTENT
========================================= */

.modal-content {
    position: relative;

    z-index: 2;

    width: calc(100% - 120px);

    margin: 0 auto;

    padding-top: 58px;
}


/* =========================================
   CLOSE BUTTON
========================================= */

.close-btn {
    position: absolute;

    top: 25px;
    right: 30px;

    width: 30px;
    height: 30px;

    border: none;

    background: transparent;

    color: #ffffff;

    font-size: 36px;

    font-family: Arial, sans-serif;

    font-weight: 300;

    line-height: 25px;

    cursor: pointer;

    z-index: 10;

    transition: 0.2s ease;
}

.close-btn:hover {
    color: #ff351e;

    transform: rotate(90deg);
}


/* =========================================
   JOIN IRONFIT
========================================= */

.join-title {
    color: #ff3822;

    font-size: 16px;

    font-weight: 800;

    letter-spacing: 2.5px;

    margin-bottom: 20px;
}


/* =========================================
   MAIN TITLE
========================================= */

h1 {
    font-family: "Anton", Impact, sans-serif;

    font-size: 48px;

    font-weight: 400;

    line-height: 1.05;

    white-space: nowrap;

    color: #f5f5f5;

    margin-bottom: 36px;
}

h1 span {
    color: #ff371f;
}


/* =========================================
   DESCRIPTION
========================================= */

.description {
    color: #eeeeee;

    font-size: 17px;

    font-weight: 500;

    line-height: 1.5;

    margin-bottom: 30px;
}


/* =========================================
   FORM
========================================= */

#membershipForm {
    width: 100%;
}


/* =========================================
   INPUT
========================================= */

.input-box {
    width: 100%;

    height: 63px;

    margin-bottom: 14px;
}

.input-box input {
    width: 100%;
    height: 100%;

    padding: 0 20px;

    border: 1px solid rgba(255, 255, 255, 0.15);

    outline: none;

    background: rgba(25, 20, 20, 0.40);

    color: white;

    font-family: "Montserrat", sans-serif;

    font-size: 15px;

    font-weight: 500;

    transition: all 0.25s ease;
}


/* Placeholder */

.input-box input::placeholder {
    color: #eeeeee;

    opacity: 1;
}


/* Input focus */

.input-box input:focus {
    border-color: #ff3a23;

    background: rgba(35, 25, 25, 0.7);

    box-shadow:
        0 0 0 1px rgba(255, 50, 30, 0.15),
        0 0 18px rgba(255, 40, 20, 0.06);
}


/* =========================================
   PAYMENT BUTTON
========================================= */

.payment-button {
    width: 100%;

    height: 62px;

    margin-top: 0;

    border: none;

    outline: none;

    background: #ff3b20;

    color: white;

    font-family: "Montserrat", sans-serif;

    font-size: 15px;

    font-weight: 800;

    letter-spacing: 0.2px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.payment-button:hover {
    background: #ff4b30;

    box-shadow:
        0 8px 25px rgba(255, 50, 25, 0.22);

    transform: translateY(-1px);
}

.payment-button:active {
    transform: translateY(0);
}


/* =========================================
   ERROR
========================================= */

.input-error {
    border-color: #ff321e !important;

    box-shadow:
        0 0 0 1px rgba(255, 50, 30, 0.3) !important;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 700px) {

    .page {
        padding: 15px;
    }

    .modal {
        width: 100%;

        min-height: auto;

        padding-bottom: 45px;
    }

    .modal-content {
        width: calc(100% - 60px);

        padding-top: 55px;
    }

    h1 {
        font-size: 38px;

        white-space: normal;
    }

    .description {
        font-size: 15px;
    }

    .close-btn {
        right: 20px;
        top: 20px;
    }
}


@media (max-width: 450px) {

    .modal-content {
        width: calc(100% - 40px);

        padding-top: 55px;
    }

    .join-title {
        font-size: 13px;

        letter-spacing: 2px;
    }

    h1 {
        font-size: 34px;
    }

    .description {
        font-size: 14px;
    }

    .input-box {
        height: 58px;
    }

    .payment-button {
        height: 58px;

        font-size: 13px;
    }
}
    </style>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Background -->
    <div class="page">

        <!-- Modal -->
        <div class="modal" id="membershipModal">

            <!-- Close -->
            <a href="Membership.html"><button class="close-btn" id="closeBtn">&times;</button></a>

            <div class="modal-content">

                <!-- Small Heading -->
                <div class="join-title">
                    JOIN SHIVGYM
                </div>

                <!-- Main Heading -->
                <h1>
                    START YOUR <span>JOURNEY</span>
                </h1>

                <!-- Description -->
                <p class="description">
                    You selected the Pro membership plan.
                </p>

                <!-- Form -->
                <form id="membershipForm">

                    <div class="input-box">
                        <input
                            type="text"
                            id="fullName"
                            placeholder="Full Name"
                        >
                    </div>

                    <div class="input-box">
                        <input
                            type="email"
                            id="email"
                            placeholder="Email Address"
                        >
                    </div>

                    <div class="input-box">
                        <input
                            type="tel"
                            id="phone"
                            placeholder="Phone Number"
                        >
                    </div>

                    <button
                        type="submit"
                        class="payment-button"
                    >
                        CONTINUE TO PAYMENT
                    </button>

                </form>

            </div>
        </div>

    </div>

    <script>
        const modal = document.getElementById("membershipModal");
const closeBtn = document.getElementById("closeBtn");
const form = document.getElementById("membershipForm");

const fullName = document.getElementById("fullName");
const email = document.getElementById("email");
const phone = document.getElementById("phone");


// =========================================
// CLOSE MODAL
// =========================================

closeBtn.addEventListener("click", () => {
    modal.style.display = "none";
});


// =========================================
// FORM SUBMISSION
// =========================================

form.addEventListener("submit", function (event) {

    event.preventDefault();

    // Remove old errors
    fullName.classList.remove("input-error");
    email.classList.remove("input-error");
    phone.classList.remove("input-error");

    let isValid = true;


    // =====================================
    // NAME VALIDATION
    // =====================================

    if (fullName.value.trim() === "") {

        fullName.classList.add("input-error");

        isValid = false;
    }


    // =====================================
    // EMAIL VALIDATION
    // =====================================

    const emailRegex =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (
        email.value.trim() === "" ||
        !emailRegex.test(email.value.trim())
    ) {

        email.classList.add("input-error");

        isValid = false;
    }


    // =====================================
    // PHONE VALIDATION
    // =====================================

    const phoneRegex =
        /^[0-9+\-\s()]{7,20}$/;

    if (
        phone.value.trim() === "" ||
        !phoneRegex.test(phone.value.trim())
    ) {

        phone.classList.add("input-error");

        isValid = false;
    }


    // =====================================
    // CHECK FORM
    // =====================================

    if (!isValid) {

        alert("Please enter valid information in all fields.");

        return;
    }


    // =====================================
    // SUCCESS
    // =====================================

    alert(
        "Welcome to ShivGym, " +
        fullName.value.trim() +
        "!"
    );


    /*
       Here you can redirect to your
       actual payment page.

       Example:

       window.location.href = "payment.html";
    */
});


// =========================================
// REMOVE ERROR WHEN USER STARTS TYPING
// =========================================

fullName.addEventListener("input", () => {
    fullName.classList.remove("input-error");
});

email.addEventListener("input", () => {
    email.classList.remove("input-error");
});

phone.addEventListener("input", () => {
    phone.classList.remove("input-error");
});
    </script>

</body>
</html>
